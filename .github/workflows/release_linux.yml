
name: Build Linux And Release

on:
  release:
    types: [published]
  workflow_dispatch:
  
jobs:
  BuildAndUploadToReleaseAssets:
    permissions:
        contents: write
    runs-on: ubuntu-latest

    steps:
        - name: Checkout code
          uses: actions/checkout@v7

        - name: Set up Python
          uses: actions/setup-python@v7
          with:
            python-version: 3.12

        - name: Setup Virtual Env
          run: python -m venv ".venv"

        - name: Install Requirements
          run: .venv/bin/pip install -r requirements.txt
        
        - name: Build with PyInstaller
          run: .venv/bin/pyinstaller --clean main.spec --distpath "./Myth Mod Manager"
        
        - name: Tar Myth Mod Manager
          run: tar -czvf Myth-Mod-Manager.tar.gz "./Myth Mod Manager/"

        - name: Upload Myth Mod Manager to Artifacts
          uses: actions/upload-artifact@v7
          with:
            path: "./Myth Mod Manager"

        - name: Upload Myth Mod Manager to Latest Release Assets
          uses: softprops/action-gh-release@v3
          if: startsWith(github.ref, 'refs/tags/')
          with:
            files: Myth-Mod-Manager.tar.gz